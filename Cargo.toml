[package]
name = "ferl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small command-line client for self-hosted ferl servers"
license = "MIT"
repository = "https://github.com/ai-slop-code/ferl-cli"
homepage = "https://github.com/ai-slop-code/ferl-cli"
readme = "README.md"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "std", "help", "usage", "error-context"] }
dialoguer = "0.12.0"
httparse = "1"
percent-encoding = "2"
rustix = { version = "1.1.6", features = ["fs", "process", "termios"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tempfile = "3.27.0"
time = { version = "0.3.41", features = ["formatting", "parsing", "macros"] }
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
webpki-root-certs = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
regex = "1"
