name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tap publishing credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ai-slop-code/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist/release
      - name: Publish and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/release/manifest.json"))["cli_version"])')
          test "$TAG" = "v$version"
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "ferl $version" \
              --notes-file "docs/releases/$version.md" dist/release/*
          fi
          gh release download "$TAG" --dir "$RUNNER_TEMP/published"
          for file in dist/release/*; do
            cmp "$file" "$RUNNER_TEMP/published/$(basename "$file")"
          done
          gh release edit "$TAG" --draft=false
      - name: Update Homebrew tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p homebrew-tap/Formula
          cp dist/release/ferl.rb homebrew-tap/Formula/ferl.rb
          cd homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ferl.rb
          if ! git diff --cached --quiet; then
            git commit -m "ferl $TAG"
            git push
          fi
